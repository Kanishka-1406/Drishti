services:
  - type: web
    name: drishti-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: drishti-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: DEVICE_API_KEY
        generateValue: true
databases:
  - name: drishti-db
    databaseName: drishti
    user: drishti
